<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Projects - DevFolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .manage-page {
      max-width: 900px;
      margin: 0 auto;
      padding: clamp(2rem, 5vw, 4rem) clamp(1rem, 4vw, 2rem);
    }
    .manage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .manage-header h1 {
      font-size: clamp(1.5rem, 3vw, 2rem);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--primary);
      font-weight: 500;
      transition: color var(--transition);
    }
    .back-link:hover {
      color: var(--primary-dark);
    }
    .project-form {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      margin-bottom: 2rem;
    }
    .project-form h2 {
      font-size: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    .form-actions {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
    }
    .btn-secondary {
      background: var(--bg-alt);
      border: 1.5px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: var(--border);
    }
    .btn-danger {
      background: var(--error);
      color: #fff;
    }
    .btn-danger:hover {
      background: #dc2626;
    }
    .btn-sm {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
    }
    .projects-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .project-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .project-item h3 {
      font-size: 1.1rem;
    }
    .project-item p {
      color: var(--text-light);
      font-size: 0.9rem;
    }
    .project-item-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-light);
    }
    .success-toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      padding: 1rem 1.5rem;
      background: #065f46;
      color: #fff;
      border-radius: 8px;
      font-weight: 500;
      display: none;
      z-index: 200;
      box-shadow: var(--shadow-lg);
    }
    .success-toast.visible {
      display: block;
    }
    .error-toast {
      background: #991b1b;
    }

    @media (min-width: 768px) {
      .form-row {
        grid-template-columns: 1fr 1fr;
      }
      .project-item {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <a href="index.html" class="brand">DevFolio<span class="brand-dot">.</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="primaryNav">
      <span></span><span></span><span></span>
    </button>
    <nav class="primary-nav" id="primaryNav">
      <a href="index.html#home">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#skills">Skills</a>
      <a href="index.html#projects">Projects</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main class="manage-page">
    <div class="manage-header">
      <h1>Manage Projects</h1>
      <a href="index.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to Portfolio
      </a>
    </div>

    <!-- Project Form -->
    <div class="project-form">
      <h2 id="formTitle">Add New Project</h2>
      <form id="projectForm" novalidate>
        <input type="hidden" id="projectId" />
        <div class="form-row">
          <div class="form-group">
            <label for="projectTitle">Title <span class="required">*</span></label>
            <input type="text" id="projectTitle" name="title" placeholder="Project name" required />
            <span class="error-message" id="projectTitleError"></span>
          </div>
          <div class="form-group">
            <label for="projectTech">Technologies</label>
            <input type="text" id="projectTech" name="technologies" placeholder="HTML, CSS, JavaScript" />
            <span class="error-message" id="projectTechError"></span>
          </div>
        </div>
        <div class="form-group">
          <label for="projectDesc">Description <span class="required">*</span></label>
          <textarea id="projectDesc" name="description" rows="3" placeholder="Brief description of the project" required></textarea>
          <span class="error-message" id="projectDescError"></span>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="projectLink">Live Demo URL</label>
            <input type="text" id="projectLink" name="project_link" placeholder="https://example.com" />
            <span class="error-message" id="projectLinkError"></span>
          </div>
          <div class="form-group">
            <label for="projectGithub">GitHub URL</label>
            <input type="text" id="projectGithub" name="github_link" placeholder="https://github.com/..." />
            <span class="error-message" id="projectGithubError"></span>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Add Project</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">Cancel</button>
        </div>
      </form>
    </div>

    <!-- Projects List -->
    <h2 style="margin-bottom: 1rem;">Existing Projects</h2>
    <div class="projects-list" id="projectsList">
      <div class="loading">Loading projects...</div>
    </div>
  </main>

  <!-- Toast Notification -->
  <div class="success-toast" id="toast"></div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-brand">
        <a href="index.html" class="brand">DevFolio<span class="brand-dot">.</span></a>
        <p>&copy; 2026 DevFolio. All rights reserved.</p>
      </div>
      <div class="footer-links">
        <a href="index.html#home">Home</a>
        <a href="index.html#projects">Projects</a>
      </div>
    </div>
  </footer>

  <script src="manage.js"></script>
</body>
</html>
